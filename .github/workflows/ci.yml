name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r typecheck
      - run: pnpm -r test
      # The Action ships its compiled bundle; fail if it's stale vs source.
      - name: Verify action dist is up to date
        run: |
          pnpm --filter @localeci/action build
          if ! git diff --quiet -- packages/action/dist; then
            echo "::error::packages/action/dist is out of date. Run 'pnpm --filter @localeci/action build' and commit."
            git --no-pager diff --stat -- packages/action/dist
            exit 1
          fi

  quality-regression:
    # The golden-set gate: any prompt/model/batching change must not regress.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter '@localeci/core' --filter '@localeci/providers' build
      # Structural regression with the mock provider (no key needed).
      - run: node golden/run.mjs
        env:
          LOCALECI_PROVIDER: mock
